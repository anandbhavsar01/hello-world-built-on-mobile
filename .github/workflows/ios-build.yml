name: iOS build

on:
  push:
    branches: [main, claude/ios-hello-world]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build HelloWorld for iOS Simulator
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List schemes
        working-directory: HelloWorld.swiftpm
        run: xcodebuild -list

      - name: Build
        working-directory: HelloWorld.swiftpm
        run: |
          xcodebuild build \
            -scheme HelloWorld \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
